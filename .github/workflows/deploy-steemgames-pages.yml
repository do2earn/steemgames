name: Build and Deploy Steem Games Website

on:
  push:
    branches: [main]
    paths-ignore:
      - "worker/**"
      - ".github/workflows/deploy-steemgames-api.yml"
      - ".github/workflows/keep-steemgames-cron-active.yml"
      - ".github/workflows/download-live-worker-source.yml"
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: steemgames-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare clean GitHub Pages output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='worker' --exclude='games' ./ _site/

      - name: Generate SEO-ready pages from the live games API
        env:
          SG_SITE_URL: https://steemgames.do2earn.dev
          SG_API_URL: https://steemgames.do2earn.workers.dev
          SG_OUTPUT_DIR: _site
          SG_TEMPLATE: game-info.html
        run: node scripts/build-game-pages.mjs

      - name: Verify generated pages before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/sitemap.xml
          page_count="$(find _site/games -mindepth 2 -maxdepth 2 -name index.html | wc -l)"
          test "$page_count" -gt 0
          test -f _site/CNAME
          echo "Generated game pages: $page_count"
          sample="$(find _site/games -mindepth 2 -maxdepth 2 -name index.html | head -n 1)"
          grep -q '<link rel="canonical" href="https://steemgames.do2earn.dev/games/' "$sample"
          grep -q 'application/ld+json' "$sample"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
