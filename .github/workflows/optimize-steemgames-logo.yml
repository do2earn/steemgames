name: Optimize Steem Games preloader logo

on:
  push:
    branches: [main]
    paths:
      - "assets/images/steemgames_logo.png"
      - ".github/workflows/optimize-steemgames-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Create optimized WebP logo
        run: |
          python - <<'PY'
          from PIL import Image
          source = "assets/images/steemgames_logo.png"
          target = "assets/images/steemgames_logo.webp"
          with Image.open(source) as image:
              image = image.convert("RGBA")
              image.thumbnail((512, 512), Image.Resampling.LANCZOS)
              image.save(target, "WEBP", quality=82, method=6)
          print(f"Optimized logo written to {target}")
          PY
      - name: Commit optimized asset
        run: |
          if git diff --quiet -- assets/images/steemgames_logo.webp; then
            echo "Optimized logo is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/steemgames_logo.webp
          git commit -m "Add optimized WebP logo for preloader"
          git push
