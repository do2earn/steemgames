name: SG Reports Generator - Collect Daily Statistics

on:
  push:
    branches: [main]
    paths:
      - "bots/sg-reports-generator/scripts/collect_stats.py"
      - "bots/sg-reports-generator/data/games.json"
      - "bots/sg-reports-generator/data/aliases.json"
      - ".github/workflows/sg-reports-collector.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: sg-reports-generator-statistics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect recent posts by configured tags
        run: python bots/sg-reports-generator/scripts/collect_stats.py

      - name: Commit dated snapshot and report
        run: |
          if [[ -n "$(git status --porcelain bots/sg-reports-generator/data/snapshots bots/sg-reports-generator/reports)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bots/sg-reports-generator/data/snapshots bots/sg-reports-generator/reports
            git commit -m "Update daily Steem games statistics"
            git push
          else
            echo "No report changes to commit."
          fi
