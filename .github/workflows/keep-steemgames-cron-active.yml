name: Keep Steem Games hourly stats trigger active

on:
  schedule:
    # Deploy 5 minutes before the Worker cron at minute 30 UTC.
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steemgames-cron-registration
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Register hourly stats cron
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Worker with hourly cron configuration
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Verify live API responds
        shell: bash
        run: |
          set -euo pipefail
          base="https://steemgames.do2earn.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$base/api/games" -o /tmp/steemgames.json
          jq -e '.success == true and (.games | type == "array")' /tmp/steemgames.json >/dev/null
          jq '{success, game_count: (.games | length), last_points_updated_at}' /tmp/steemgames.json
