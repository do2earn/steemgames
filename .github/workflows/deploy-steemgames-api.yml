name: Deploy Steem Games API

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-steemgames-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steemgames-api-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Smoke-test live API endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://steemgames.do2earn.workers.dev"

          echo "Checking SteemWorld tag-feed pagination source..."
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "https://sds0.steemworld.org/feeds_api/getPostsByTagCreated/steem/null/0/2/0" -o /tmp/steemworld.json
          jq -e '.code == 0 and (.result.rows | type == "array") and (.result.rows | length > 0)' /tmp/steemworld.json >/dev/null
          echo "SteemWorld tag-feed endpoint returned valid paginated rows."

          echo "Checking /api/games..."
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "$base/api/games" -o /tmp/steemgames.json
          jq -e '.success == true and .stats_engine == "steemworld-offset-v4" and (.games | type == "array")' /tmp/steemgames.json >/dev/null
          jq '{success, game_count: (.games | length), sample: [.games[:2][] | {game_name, points, posts, users, votes, stats_synced_at}]}' /tmp/steemgames.json

          echo "Checking /api/stats..."
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "$base/api/stats" -o /tmp/steemgames-stats.json
          jq -e '.success == true and (.stats | type == "object")' /tmp/steemgames-stats.json >/dev/null
          jq . /tmp/steemgames-stats.json
