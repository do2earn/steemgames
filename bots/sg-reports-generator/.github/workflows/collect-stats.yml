name: SGA - Collect Steem Game Statistics

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_stats.py"
      - "data/games.json"
      - "data/aliases.json"
      - ".github/workflows/collect-stats.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: sga-statistics-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect recent posts by configured tags
        run: python scripts/collect_stats.py

      - name: Commit dated snapshot and report
        run: |
          if [[ -n "$(git status --porcelain data/snapshots reports)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/snapshots reports
            git commit -m "Update daily Steem games statistics"
            git push
          else
            echo "No report changes to commit."
          fi
