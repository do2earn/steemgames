<!-- Steem Games directory component; loaded directly into the second homepage card (no iframe). -->
<div class="sg-directory">
  <div class="sg-directory-heading">
    <div><p class="eyebrow">THE DIRECTORY</p><h2>Explore Steem Games</h2></div>
    <label class="sg-search"><span class="sr-only">Search games</span><input id="gameSearch" type="search" placeholder="Search games…" autocomplete="off" aria-label="Search Steem games"></label>
  </div>
  <p id="gamesStatus" class="status" role="status" aria-live="polite">Loading games…</p>
  <div class="sg-table-wrap">
    <table class="sg-games-table">
      <thead><tr><th scope="col">Rank</th><th scope="col">Game</th><th scope="col">Points</th><th scope="col">Actions</th></tr></thead>
      <tbody id="gamesTableBody"><tr><td colspan="4">Loading games…</td></tr></tbody>
    </table>
  </div>
  <dialog id="gameInfoDialog" class="sg-info-dialog" aria-labelledby="gameInfoTitle">
    <div class="sg-info-content"><button id="closeGameInfo" class="dialog-close" type="button" aria-label="Close game information">×</button><p class="eyebrow">GAME DETAILS</p><h2 id="gameInfoTitle">Game information</h2><p id="gameInfoDeveloper" class="muted"></p><p id="gameInfoAbout"></p><p id="gameInfoTag" class="sg-info-tag"></p><a id="gameInfoWebsite" class="button secondary" href="#" target="_blank" rel="noopener noreferrer">Official Website</a></div>
  </dialog>
</div>
